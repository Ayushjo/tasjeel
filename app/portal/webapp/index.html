<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasjeel · Supplier Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <script>
    // Language and theme are decided before UI5 boots: RTL is fixed at boot time,
    // so switching language reloads the page with the new setting (see Component#setLanguage).
    (function () {
      var lang = "en", theme = "light";
      try { lang = localStorage.getItem("tj-lang") || lang; theme = localStorage.getItem("tj-theme") || theme; } catch (e) { /* private mode */ }
      var q = new URLSearchParams(location.search);
      lang = q.get("lang") || lang; theme = q.get("theme") || theme;
      window["sap-ui-config"] = {
        language: lang === "ar" ? "ar" : "en",
        theme: theme === "dark" ? "sap_horizon_dark" : "sap_horizon"
      };
      document.documentElement.lang = lang;
    })();
  </script>
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.148.12/resources/sap-ui-core.js"
    data-sap-ui-libs="sap.m,sap.tnt,sap.f,sap.ui.layout"
    data-sap-ui-compat-version="edge"
    data-sap-ui-async="true"
    data-sap-ui-resource-roots='{ "tasjeel.portal": "./" }'
    data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
    data-sap-ui-fiori-3-compatible="false">
  </script>
</head>
<body class="sapUiBody" id="content">
  <div data-sap-ui-component data-name="tasjeel.portal" data-id="container" data-settings='{ "id": "portal" }' data-height="100%"></div>
</body>
</html>
