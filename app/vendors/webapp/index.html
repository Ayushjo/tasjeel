<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasjeel · Approved vendors</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>html, body, #content, #content > div { height: 100%; margin: 0; }</style>
  <script>
    // Same language/theme preference as the portal (shared origin → shared localStorage).
    (function () {
      var lang = "en", theme = "light", user = "reviewer";
      try { lang = localStorage.getItem("tj-lang") || lang; theme = localStorage.getItem("tj-theme") || theme; user = localStorage.getItem("tj-user") || user; } catch (e) {}
      window["sap-ui-config"] = { language: lang, theme: theme === "dark" ? "sap_horizon_dark" : "sap_horizon" };
      document.documentElement.lang = lang;
      if (theme === "dark") document.documentElement.classList.add("tjDark");
      // Only when served straight from the local CAP server (:4004): its mocked auth expects Basic auth.
      // Behind the approuter (hybrid :5000 or BTP) the session cookie + XSUAA token handle this.
      if (["localhost", "127.0.0.1"].includes(location.hostname) && location.port === "4004") {
        var auth = "Basic " + btoa(user + ":"), open = XMLHttpRequest.prototype.open, send = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.open = function (m, url) { this.__tjOData = /(^|\/)odata\//.test(url); return open.apply(this, arguments); };
        XMLHttpRequest.prototype.send = function () { if (this.__tjOData) this.setRequestHeader("Authorization", auth); return send.apply(this, arguments); };
      }
    })();
  </script>
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.148.12/resources/sap-ui-core.js"
    data-sap-ui-compat-version="edge"
    data-sap-ui-async="true"
    data-sap-ui-resource-roots='{ "tasjeel.vendors": "./" }'
    data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
    data-sap-ui-frame-options="trusted"
    data-sap-ui-flexibility-services='[{ "connector": "LocalStorageConnector" }]'>
  </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
  <div data-sap-ui-component data-name="tasjeel.vendors" data-id="container" data-settings='{ "id": "vendors" }' data-handle-validation="true" data-height="100%"></div>
</body>
</html>
