<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signed out · Tasjeel</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
  <style>
    :root { --bg: #f7f7f5; --surface: #fff; --border: #e3e3df; --text: #161616; --muted: #64645f; --accent: #0f5f58; --on-accent: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111110; --surface: #191918; --border: #2a2a28; --text: #ececea; --muted: #9a9a94; --accent: #4fb3a6; --on-accent: #0c1f1d; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
      font: 15px/1.5 "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, sans-serif; }
    main { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 32px 28px; }
    .mark { display: block; margin-bottom: 20px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; }
    p { margin: 0 0 4px; color: var(--muted); }
    [dir=rtl] { font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; }
    a { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 16px; margin-top: 24px; width: 100%;
      background: var(--accent); color: var(--on-accent); border-radius: 3px; text-decoration: none; font-weight: 500; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
      <rect width="24" height="24" rx="3" fill="var(--accent)"/>
      <g fill="var(--on-accent)"><rect x="6" y="10" width="12" height="2.6"/><rect x="10.7" y="10" width="2.6" height="8.5"/><rect x="8.6" y="5.4" width="2.4" height="2.4"/><rect x="13" y="5.4" width="2.4" height="2.4"/></g>
    </svg>
    <h1>You are signed out</h1>
    <p>Your Tasjeel session has ended.</p>
    <p dir="rtl" lang="ar">تم تسجيل خروجك من تسجيل.</p>
    <a href="/">Sign in again</a>
  </main>
</body>
</html>
