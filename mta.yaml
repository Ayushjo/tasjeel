_schema-version: 3.3.0
ID: tasjeel
version: 1.0.0
description: Tasjeel supplier onboarding on SAP BTP (CAP + SAPUI5 + HANA Cloud + S/4HANA Business Partner)
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # ---------------------------------------------------------------- backend
  - name: tasjeel-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
      instances: 1
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: tasjeel-auth
      - name: tasjeel-db
      - name: tasjeel-destination
      - name: tasjeel-connectivity

  - name: tasjeel-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: tasjeel-db

  # ---------------------------------------------------------------- approuter (public entry point)
  - name: tasjeel
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: tasjeel-auth
      - name: tasjeel-destination
      - name: tasjeel-html5-runtime
    provides:
      - name: app-api
        properties:
          app-uri: ${default-uri}

  # ---------------------------------------------------------------- UI apps → HTML5 Application Repository
  - name: tasjeel-ui-portal
    type: html5
    path: app/portal
    build-parameters:
      builder: custom
      commands:
        - node ../../scripts/build-ui.mjs portal
      build-result: dist
      supported-platforms: []

  - name: tasjeel-ui-vendors
    type: html5
    path: app/vendors
    build-parameters:
      builder: custom
      commands:
        - node ../../scripts/build-ui.mjs vendors
      build-result: dist
      supported-platforms: []

  - name: tasjeel-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: tasjeel-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: tasjeel-ui-portal
          artifacts: [tasjeelportal.zip]
          target-path: resources/
        - name: tasjeel-ui-vendors
          artifacts: [tasjeelvendors.zip]
          target-path: resources/

  # Destinations used by the apps' xs-app.json, and by SAP Build Work Zone to find the apps (sap.cloud.service)
  - name: tasjeel-destination-content
    type: com.sap.application.content
    requires:
      - name: tasjeel-destination
        parameters:
          content-target: true
      - name: tasjeel-html5-repo-host
        parameters:
          service-key:
            name: tasjeel-html5-repo-host-key
      - name: tasjeel-auth
        parameters:
          service-key:
            name: tasjeel-auth-key
      - name: srv-api
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: tasjeel-srv-api
              URL: ~{srv-api/srv-url}
              Type: HTTP
              ProxyType: Internet
              Authentication: NoAuthentication
              HTML5.ForwardAuthToken: true
            - Name: tasjeel-html5-repository
              ServiceInstanceName: tasjeel-html5-repo-host
              ServiceKeyName: tasjeel-html5-repo-host-key
              sap.cloud.service: tasjeel.service
            - Name: tasjeel-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: tasjeel-auth
              ServiceKeyName: tasjeel-auth-key
              sap.cloud.service: tasjeel.service

resources:
  # Already created for hybrid mode in Phase 7; the deployment adopts and updates it (same xsappname, same role collections).
  - name: tasjeel-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  - name: tasjeel-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: tasjeel-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0

  # Phase 9: reaches the mock "on-premise" S/4 through the Cloud Connector
  - name: tasjeel-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  - name: tasjeel-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: tasjeel-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
